# ld65 config for a loadable X816 program.
#
# Programs live at $01:0000 -- the first SDRAM bank. The four-byte magic
# "X816" sits at the base and the entry point is $01:0004, which is what
# boot/boot.s jumps to after it drops the ROM overlay.
#
# No fill: the image is exactly as long as the code, and the RTL's HPS loader
# adds PROG_BASE to the file offset, so offset 0 lands on the magic.
MEMORY {
  PROG: start=$010000, size=$010000, type=rw, file=%O;
}
SEGMENTS {
  MAGIC: load=PROG, type=ro, start=$010000;
  CODE:  load=PROG, type=ro, start=$010004;
}
