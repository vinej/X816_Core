# ld65 config for the 256-byte boot ROM overlay at $00:FF00-$00:FFFF.
# fillval=$00 so unused bytes are BRK, not a NOP slide into the vectors.
MEMORY {
  ROM: start=$FF00, size=$0100, type=ro, fill=yes, fillval=$00, file=%O;
}
SEGMENTS {
  BOOT:    load=ROM, type=ro, start=$FF00;
  VECT816: load=ROM, type=ro, start=$FFE4;
  VECTORS: load=ROM, type=ro, start=$FFF4;
}
