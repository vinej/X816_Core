# ld65 config for the tb_boot firmware probe: the kernel image shape
# (doc/KERNEL.md §3) -- "X816" magic at $F0:0000, entry at $F0:0004.
# Same layout rule as boot/prog.cfg, relocated to the firmware region.
MEMORY {
  FW: start=$F00000, size=$010000, type=rw, file=%O;
}
SEGMENTS {
  MAGIC: load=FW, type=ro, start=$F00000;
  CODE:  load=FW, type=ro, start=$F00004;
}
